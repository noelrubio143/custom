name: Release Server Binary

on:
  workflow_dispatch:
    inputs:
      unpack_upx:
        description: Unpack UPX-packed binaries first
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare assets
        run: |
          set -e
          shopt -s nullglob
          files=(server/custom-linux-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No binary found in server/ (example server/custom-linux-amd64)"
            exit 1
          fi
          mkdir -p dist
          for f in "${files[@]}"; do
            cp "$f" "dist/$(basename "$f")"
          done

      - name: Unpack UPX
        if: ${{ inputs.unpack_upx }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl
          for f in dist/custom-linux-*; do
            upx -d "$f" || echo "Skipped $f (not UPX packed or unsupported)"
          done

      - name: Checksums
        run: |
          chmod +x dist/custom-linux-*
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-server
          path: dist/
          retention-days: 30
