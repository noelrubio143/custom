install_custom() {
  local repo="noelrubio143/custom"
  local tag="${1:-latest}"
  local arch base tmp expected actual

  case "$(uname -m)" in
    x86_64|amd64)  arch="amd64" ;;
    aarch64|arm64) arch="arm64" ;;
    *) echo "Hindi supported ang arch: $(uname -m)"; return 1 ;;
  esac

  if [ "$tag" = "latest" ]; then
    base="https://github.com/$repo/releases/latest/download"
  else
    base="https://github.com/$repo/releases/download/$tag"
  fi

  tmp=$(mktemp -d)
  curl -fsSL "$base/custom-linux-$arch" -o "$tmp/custom" || { echo "Failed download"; return 1; }
  curl -fsSL "$base/SHA256SUMS.txt" -o "$tmp/SHA256SUMS.txt" || { echo "Failed checksum download"; return 1; }

  expected=$(grep " custom-linux-$arch\$" "$tmp/SHA256SUMS.txt" | awk '{print $1}')
  actual=$(sha256sum "$tmp/custom" | awk '{print $1}')
  if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
    echo "Checksum mismatch, hindi ini-install"
    rm -rf "$tmp"
    return 1
  fi

  install -m 755 "$tmp/custom" /usr/local/bin/custom
  rm -rf "$tmp"
  echo "custom installed: /usr/local/bin/custom"
}

install_custom        # o install_custom v1.4 para sa specific na tag
