name: Release Server Binary

on:
  workflow_dispatch:
    inputs:
      unpack_upx:
        description: Unpack UPX-packed binaries first
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare assets
        run: |
          set -e
          mkdir -p dist
          count=0
          for f in server/*; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = "README.md" ] && continue
            cp "$f" "dist/$(basename "$f")"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "No binary found in server/ (upload it there first)"
            exit 1
          fi
          ls -l dist

      - name: Unpack UPX
        if: ${{ inputs.unpack_upx }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl
          for f in dist/*; do
            upx -d "$f" || echo "Skipped $f (not UPX packed or unsupported)"
          done

      - name: Checksums
        run: |
          chmod +x dist/*
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-server
          path: dist/
          retention-days: 30
